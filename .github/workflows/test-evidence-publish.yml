name: Test evidence publish

# SFBL-334 / SFBL-345. Single workflow that aggregates allure-results from
# every upstream test workflow and publishes a merged report to the live
# evidence dashboard at https://reports.bulkloader.forcetide.net.
#
# Fires via `workflow_run` AFTER the upstream workflows (e2e-pr.yml +
# ci-shared.yml) complete — not on push/pull_request directly. This lets the
# publish wait for ALL test legs to finish without coordinating across
# workflow boundaries.
#
# Concurrency model (locked by Codex review on SFBL-334):
#   One global concurrency group across every branch and PR.
#   cancel-in-progress: false → second push queues behind the first so the
#   history-merge step always sees a consistent state. Without this, two
#   concurrent publishes can race on the prefix and clobber each other.
#
# Forked-PR policy (locked by Codex review on SFBL-334):
#   Forks do not publish to S3. The workflow_run context for a fork-PR run
#   carries no repository secrets, so OIDC assumption would fail anyway —
#   but we surface the policy explicitly and post a PR comment pointing the
#   reviewer at the GHA HTML artefact fallback.

on:
  workflow_run:
    workflows:
      - "E2E PR Checks (Tier 1a + 1b)"
      - "Shared Quality Checks"
      # SFBL-348: Tier 2 publishing. Three upstream entry points all upload
      # `allure-results-tier-2`; each lands as a per-run report at
      # `tier-2/<upstream_run_id>/` with a SHARED `tier-2/history/` trend.
      # Release fires only when its tier-2-e2e job ran + uploaded artefacts;
      # the publish job exits silently otherwise (release tag without Tier 2
      # is not an error condition — only releases gated on Tier 2 produce a
      # publish).
      - "E2E Tier 2 — nightly"
      - "E2E Tier 2 — PR label opt-in"
      - "Release"
    types: [completed]

# Single global concurrency group. cancel-in-progress: false because two
# pushes in flight against the same PR prefix MUST serialise — the history
# merge is a read-modify-write on s3://${BUCKET}/${PREFIX}/history/ and
# concurrent writes would corrupt it.
concurrency:
  group: test-evidence-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC assumption against the SFBL-341 publisher role
  pull-requests: write  # to post the deep-link comment
  actions: read   # required by actions/download-artifact@v4 with `run-id`
                  # to fetch artefacts from another workflow run. Without
                  # it the download silently fails (Codex P1 on PR #91).

env:
  BUCKET: bulkloader-testevidence-evidencebucketfba44255-dul0vrjuirrp
  DISTRIBUTION_ID: E25UFH1IGQN249
  PUBLISHER_ROLE_ARN: arn:aws:iam::628709410721:role/sfbl-test-evidence-publisher
  AWS_REGION: us-east-1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Resolve context: PR number, prefix, fork-vs-same-repo classification.
  # The workflow_run event payload carries the originating workflow's
  # commit + ref + head_repository; we use those to derive what to do.
  # ───────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve publish context
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    outputs:
      is_fork: ${{ steps.ctx.outputs.is_fork }}
      is_pr: ${{ steps.ctx.outputs.is_pr }}
      is_tier_2: ${{ steps.ctx.outputs.is_tier_2 }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      prefix: ${{ steps.ctx.outputs.prefix }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      this_run_id: ${{ github.event.workflow_run.id }}
      this_workflow: ${{ github.event.workflow_run.name }}
      sibling_run_id: ${{ steps.sibling.outputs.sibling_run_id }}
      sibling_ready: ${{ steps.sibling.outputs.sibling_ready }}
    steps:
      - id: ctx
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBERS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          THIS_WORKFLOW: ${{ github.event.workflow_run.name }}
          THIS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Fork detection: head_repository differs from base.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

          # SFBL-348: Tier 2 classification. Tier 2 upstreams produce a
          # single allure-results-tier-2 artefact and want a per-run prefix
          # with shared history. The Release workflow also publishes Tier 2
          # results when its tier-2-e2e job ran; the publish job will exit
          # silently if no Tier 2 artefact is present.
          case "$THIS_WORKFLOW" in
            "E2E Tier 2 — nightly"|"E2E Tier 2 — PR label opt-in"|"Release")
              IS_TIER_2=true
              ;;
            *)
              IS_TIER_2=false
              ;;
          esac
          echo "is_tier_2=$IS_TIER_2" >> "$GITHUB_OUTPUT"

          # PR vs push classification. workflow_run on a PR carries the
          # pull_requests array; on a push it's empty.
          PR_NUM=$(printf '%s' "$PR_NUMBERS" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(arr[0]['number']) if arr else print('')")
          if [ "$IS_TIER_2" = "true" ]; then
            # Tier 2: per-run prefix, never per-PR. Tier 2 isn't tied to a
            # single PR even when triggered by the label opt-in — the run-id
            # is the only stable identifier across reruns.
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "prefix=tier-2/${THIS_RUN_ID}" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_NUM" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "prefix=pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_BRANCH" = "main" ]; then
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "prefix=main" >> "$GITHUB_OUTPUT"
          else
            # Push to a non-main branch — nothing to do. Surface via empty prefix.
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "prefix=" >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          echo "=== Context ==="
          echo "  HEAD_REPO=$HEAD_REPO BASE_REPO=$BASE_REPO"
          echo "  EVENT_NAME=$EVENT_NAME HEAD_BRANCH=$HEAD_BRANCH HEAD_SHA=$HEAD_SHA"
          echo "  THIS_WORKFLOW=$THIS_WORKFLOW is_tier_2=$IS_TIER_2"
          echo "  is_fork=$(grep '^is_fork=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "  prefix=$(grep '^prefix=' $GITHUB_OUTPUT | cut -d= -f2)"

      # ───────────────────────────────────────────────────────────────────────
      # Sibling-run lookup (Codex P1 on PR #91).
      #
      # `workflow_run` fires SEPARATELY for each upstream workflow that
      # completes. If E2E and Shared Quality both produce artefacts for the
      # same commit, our publish workflow gets two triggers — and each one
      # only sees its own trigger's run-id. Downloading from only that one
      # gets us one layer's allure-results; the publish then syncs to the
      # prefix with `--delete`, wiping the other layer's prior upload.
      #
      # Fix: look up the SIBLING workflow's run for the same head_sha. Only
      # proceed with publish when both are completed. If the sibling hasn't
      # finished yet, exit silently — its trigger will fire later and
      # publish then (with both runs visible).
      - id: sibling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IS_TIER_2: ${{ steps.ctx.outputs.is_tier_2 }}
        run: |
          set -euo pipefail
          # SFBL-348: Tier 2 runs solo (no companion workflow producing
          # allure-results for the same head_sha) — short-circuit the
          # sibling lookup so publish can proceed with just this_run.
          if [ "$IS_TIER_2" = "true" ]; then
            echo "Tier 2 upstream — no sibling expected."
            echo "sibling_ready=true" >> "$GITHUB_OUTPUT"
            echo "sibling_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map this workflow's display name to the sibling's filename.
          case "$THIS_WORKFLOW" in
            "E2E PR Checks (Tier 1a + 1b)")
              SIBLING_WORKFLOW="ci-shared.yml"
              ;;
            "Shared Quality Checks")
              SIBLING_WORKFLOW="e2e-pr.yml"
              ;;
            *)
              echo "Unknown upstream workflow: $THIS_WORKFLOW" >&2
              exit 1
              ;;
          esac

          # gh run list lets us filter by workflow + head_sha. Take the
          # latest (default sort: createdAt desc) — same commit can have
          # multiple runs from retries / pushes.
          SIBLING_JSON=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "$SIBLING_WORKFLOW" \
            --commit "$HEAD_SHA" \
            --limit 1 \
            --json databaseId,status,conclusion \
            2>/dev/null || echo "[]")
          SIBLING_ID=$(echo "$SIBLING_JSON" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(arr[0]['databaseId']) if arr else print('')")
          SIBLING_STATUS=$(echo "$SIBLING_JSON" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(arr[0]['status']) if arr else print('none')")

          echo "=== Sibling lookup ==="
          echo "  this_workflow=$THIS_WORKFLOW (run-id ${{ github.event.workflow_run.id }})"
          echo "  sibling_workflow=$SIBLING_WORKFLOW"
          echo "  sibling_run_id=$SIBLING_ID"
          echo "  sibling_status=$SIBLING_STATUS"

          if [ -z "$SIBLING_ID" ] || [ "$SIBLING_STATUS" != "completed" ]; then
            echo "Sibling not yet completed; this trigger exits without publishing."
            echo "When the sibling finishes, its own workflow_run trigger will fire and"
            echo "find THIS run completed — that's when publish actually runs."
            echo "sibling_ready=false" >> "$GITHUB_OUTPUT"
            echo "sibling_run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "sibling_ready=true" >> "$GITHUB_OUTPUT"
            echo "sibling_run_id=$SIBLING_ID" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Fork PR → skip publish + drop a PR comment with the policy explanation.
  # ───────────────────────────────────────────────────────────────────────────
  skip-fork:
    name: Skip publish (fork PR)
    needs: [resolve]
    runs-on: ubuntu-latest
    if: needs.resolve.outputs.is_fork == 'true' && needs.resolve.outputs.is_pr == 'true'
    steps:
      - name: Post explanatory PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ needs.resolve.outputs.pr_number }}
          body: |
            🚧 Test evidence dashboard publish skipped for this fork PR.

            Per the SFBL-334 forked-PR policy, fork PRs do not publish to the
            S3 evidence bucket — `workflow_run` triggered from a fork has no
            access to repository secrets or OIDC trust, and the dashboard's
            access control assumes same-repo collaborators.

            **Where to find the test artefacts:** the Playwright HTML report
            for any failed runs is uploaded as a 7-day GHA artefact on the
            upstream [E2E PR Checks run]({{actions-run-url}}). Click through
            and download the `playwright-report-tier-*` artefact.

            Once this PR is merged or rebased onto the base repo, the
            evidence dashboard will resume publishing for it.
          edit-mode: replace

  # ───────────────────────────────────────────────────────────────────────────
  # Same-repo PR or push to main → publish via the wrapper script.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to S3 evidence bucket
    needs: [resolve]
    runs-on: ubuntu-latest
    # Skip when the fork policy applies, the prefix is empty (push to a
    # non-main branch), or the sibling upstream workflow hasn't finished
    # yet (the sibling's own workflow_run trigger will retry).
    if: |
      needs.resolve.outputs.is_fork == 'false' &&
      needs.resolve.outputs.prefix != '' &&
      needs.resolve.outputs.sibling_ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Sparse checkout — we only need the wrapper script + workflows.
          # The full test source isn't needed because we're working from
          # downloaded artefacts.
          sparse-checkout: |
            tests/e2e/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Node (for allure-commandline)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install allure-commandline
        run: npm install -g allure-commandline@2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Download from BOTH the triggering run AND its sibling. Without the
      # sibling download, a publish triggered by E2E only sees Tier 1a/1b
      # results and the subsequent --delete sync would wipe backend
      # evidence from the bucket (Codex P1 on PR #91). Each pattern is
      # mutually exclusive across runs (e2e-pr.yml produces only tier-*,
      # ci-shared.yml produces only backend-*), but we use the same two
      # patterns against both runs so the workflow stays symmetric — the
      # non-matching patterns just produce empty downloads.
      - name: Download Playwright allure-results from this run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.this_run_id }}
          pattern: "allure-results-tier-*"
          path: ./_inputs/playwright
          merge-multiple: true
        continue-on-error: true

      - name: Download Playwright allure-results from sibling run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.sibling_run_id }}
          pattern: "allure-results-tier-*"
          path: ./_inputs/playwright
          merge-multiple: true
        continue-on-error: true

      - name: Download backend allure-results from this run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.this_run_id }}
          pattern: "allure-results-backend-*"
          path: ./_inputs/backend
          merge-multiple: true
        continue-on-error: true

      - name: Download backend allure-results from sibling run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.sibling_run_id }}
          pattern: "allure-results-backend-*"
          path: ./_inputs/backend
          merge-multiple: true
        continue-on-error: true

      # SFBL-348: Tier 2 download. Tier 2 runs solo — no sibling — so we
      # only fetch from this_run. The pattern is deliberately specific
      # (`allure-results-tier-2`) so a Tier 1a/1b publish doesn't accidentally
      # pull in Tier 2 results from a different upstream run that happens to
      # share a head_sha.
      - name: Download Tier 2 allure-results from this run
        if: needs.resolve.outputs.is_tier_2 == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.this_run_id }}
          pattern: "allure-results-tier-2"
          path: ./_inputs/tier-2
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded artefacts
        run: |
          echo "=== Playwright ==="
          ls -la ./_inputs/playwright 2>/dev/null || echo "(empty)"
          echo "=== Backend ==="
          ls -la ./_inputs/backend 2>/dev/null || echo "(empty)"
          echo "=== Tier 2 ==="
          ls -la ./_inputs/tier-2 2>/dev/null || echo "(empty)"

      - name: Publish
        env:
          # SFBL-348: Tier 2 uses a SHARED history prefix so the trend graph
          # spans every run. For Tier 1a/1b/backend publishes this env is
          # unset and the wrapper falls back to per-prefix history (existing
          # behavior).
          HISTORY_PREFIX: ${{ needs.resolve.outputs.is_tier_2 == 'true' && 'tier-2/history' || '' }}
        run: |
          set -euo pipefail
          # Collect non-empty input dirs. The wrapper tolerates missing
          # dirs but warns if all are missing — for Tier 1/backend we fail
          # loudly because "publish ran with no input" almost always means
          # an upstream upload step is broken. For Tier 2 specifically we
          # exit silently: a Release run that didn't run its tier-2-e2e
          # job (e.g. tier-2 label not set) shouldn't error every publish.
          INPUTS=()
          if [ -d ./_inputs/playwright ] && [ -n "$(ls -A ./_inputs/playwright 2>/dev/null)" ]; then
            INPUTS+=("./_inputs/playwright")
          fi
          if [ -d ./_inputs/backend ] && [ -n "$(ls -A ./_inputs/backend 2>/dev/null)" ]; then
            INPUTS+=("./_inputs/backend")
          fi
          if [ -d ./_inputs/tier-2 ] && [ -n "$(ls -A ./_inputs/tier-2 2>/dev/null)" ]; then
            INPUTS+=("./_inputs/tier-2")
          fi
          if [ "${#INPUTS[@]}" -eq 0 ]; then
            if [ "${{ needs.resolve.outputs.is_tier_2 }}" = "true" ]; then
              echo "No Tier 2 allure-results in upstream run ${{ github.event.workflow_run.id }} — nothing to publish (e.g. release without tier-2-e2e). Exiting silently."
              exit 0
            fi
            echo "ERROR: no allure-results artefacts found in upstream run ${{ github.event.workflow_run.id }}" >&2
            echo "       Either the upstream workflow ran zero tests, or the artefact upload step is missing." >&2
            exit 1
          fi

          tests/e2e/scripts/publish-evidence.sh \
            "${BUCKET}" \
            "${DISTRIBUTION_ID}" \
            "${{ needs.resolve.outputs.prefix }}" \
            "${INPUTS[@]}"

      - name: Post deep-link PR comment
        if: needs.resolve.outputs.is_pr == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ needs.resolve.outputs.pr_number }}
          body: |
            📊 **Test evidence dashboard for this PR**:
            https://reports.bulkloader.forcetide.net/${{ needs.resolve.outputs.prefix }}/

            Auth-gated via GitHub OAuth (same-repo collaborators only — see
            [test-evidence-runbook.md](https://github.com/eelywasa/sf-bulk-loader/blob/main/docs/operations/test-evidence-runbook.md)).
            Updates on every push; retained for 30 days after the PR closes.
          edit-mode: replace

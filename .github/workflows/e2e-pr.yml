name: E2E PR Checks (Tier 1a + 1b)

# Runs on every PR — the lightweight, org-free and fixture-based tiers.
# Tier 2 (real Salesforce scratch org) is NOT triggered here; see D8 in
# docs/specs/implemented/e2e-testing-spec.md for the full trigger policy. Tier 2 lives
# inside release.yml (release-tag gate) and a nightly cron workflow.
#
# Security policy (D8 / pull_request_target warning):
#   Uses `pull_request` — NOT `pull_request_target`. This means workflow code
#   always runs in the context of the PR branch, not the base branch. No
#   repository secrets are needed for Tier 1a or 1b; if secrets ever become
#   required for a new step, they must NOT be added to this workflow for fork
#   PRs. See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
#
# Topology (SFBL-335 structural refactor):
#   build-images   ── builds backend + frontend once, uploads tarballs
#       │
#       ├─► e2e-tier-1a  ── downloads images, runs Tier 1a (org-free)
#       └─► e2e-tier-1b  ── downloads images, runs Tier 1b (fixture-mode)
#
#   Each tier job pulls the pre-built images via `docker load`, skipping
#   its own build step. Tier 1a + 1b run in parallel after the build.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege — no secrets required for Tier 1a or 1b
permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # build-images — runs once per workflow; both tier jobs depend on it.
  # Saves the two images as workflow artefacts so the tier jobs can `docker
  # load` them without re-building. Cuts overall wall-clock roughly in half
  # vs. each tier rebuilding independently (per SFBL-335).
  # ---------------------------------------------------------------------------
  build-images:
    name: Build backend + frontend images
    runs-on: ubuntu-latest
    # 15 min headroom for the worst-case PyPI flake (e.g. multidict
    # ReadTimeoutError forcing pip retries — observed on PR #88).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Explicit `scope=` on the GHA cache directives is critical (SFBL-335
      # follow-up): without it, docker/build-push-action derives a scope key
      # from the workflow + job name + some internals, and we observed two
      # consecutive PR pushes writing *different* cache manifests rather than
      # the second hitting the first's cache (PR #88 runs 25672963085 /
      # 25673555777 / 25674253813 each took ~6-10 min from cold).  Pinning the
      # scope to a stable string per image (`backend` / `frontend`) gives
      # subsequent pushes on the same PR a deterministic key to hit.
      - name: Build backend image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: sfbl-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: sfbl-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Export images to tarballs
        # docker save uncompressed; the upload-artifact step zstds on the way
        # up so a separate gzip here would be redundant.
        run: |
          mkdir -p /tmp/images
          docker save sfbl-backend:ci  -o /tmp/images/sfbl-backend.tar
          docker save sfbl-frontend:ci -o /tmp/images/sfbl-frontend.tar
          ls -lh /tmp/images

      - name: Upload image artefacts
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pr-images
          path: /tmp/images/
          retention-days: 1
          compression-level: 1

  # ---------------------------------------------------------------------------
  # Tier 1a — org-free flows: file pane, plan list, RBAC nav, settings, login
  # Runs on every PR.
  # ---------------------------------------------------------------------------
  e2e-tier-1a:
    name: E2E Tier 1a (org-free)
    runs-on: ubuntu-latest
    needs: [build-images]
    # 15 min — actual Playwright work is sub-minute. The dominant cost is
    # `npx playwright install --with-deps chromium`, which has been
    # observed taking 9m23s on a slow runner (PR #92 run 25806336447 hit
    # the previous 10m ceiling with all test steps passing but the job
    # cancelled during cleanup). 15m leaves ~5m of headroom over the
    # worst-case observed without papering over a true regression.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          # D7/D13: lockfile lives at tests/e2e/, not the repo root
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Create data directories
        # data/db and data/output are mounted as writable volumes; chmod 777 so
        # the non-root container user (appuser) can write on the CI runner.
        run: |
          mkdir -p data/input data/output data/db
          chmod 777 data/db data/output

      - name: Create CI env file
        # APP_DISTRIBUTION=desktop disables the login wall so Playwright can
        # reach the app directly without auth credentials.
        # ENCRYPTION_KEY/JWT_SECRET_KEY are auto-generated on first start and
        # written to /data/db/*.key (writable volume) — intentionally omitted.
        run: |
          echo 'APP_DISTRIBUTION=desktop' > .env

      - name: Download pre-built images
        uses: actions/download-artifact@v8
        with:
          name: e2e-pr-images
          path: /tmp/images

      - name: Load images into local Docker daemon
        run: |
          docker load -i /tmp/images/sfbl-backend.tar
          docker load -i /tmp/images/sfbl-frontend.tar
          docker image ls --filter reference=sfbl-*

      - name: Bring up stack
        # docker-compose.ci.yml overrides build: → image: so compose uses the
        # pre-loaded images above rather than rebuilding. --wait blocks until
        # the backend healthcheck passes (curl /api/health/ready).
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --timeout 120

      - name: Verify stack is reachable
        run: |
          curl -sf http://localhost/api/health \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Expected status ok, got: {d}'
          print('Health check passed:', d)
          "

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Tier 1a
        working-directory: tests/e2e
        env:
          CI: 'true'
          # The nginx proxy inside the frontend container serves on port 80;
          # override the default (5173, which is the local Vite dev server).
          E2E_BASE_URL: 'http://localhost'
        run: npm run e2e:1a

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-tier-1a
          path: tests/e2e/playwright-report/
          retention-days: 7

      # SFBL-334 / SFBL-345: Always upload allure-results so the publish
      # workflow can fetch them via download-artifact, regardless of the
      # test outcome. `if: always()` is the load-bearing bit — failing runs
      # are exactly when we most want the evidence available.
      - name: Upload Tier 1a allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-tier-1a
          path: tests/e2e/allure-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Bring down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ---------------------------------------------------------------------------
  # Tier 1b — metadata-reading flows using captured describe fixtures
  # (field-mapping panel, object combobox, SOQL validator)
  # ---------------------------------------------------------------------------
  e2e-tier-1b:
    name: E2E Tier 1b (fixture-mode)
    runs-on: ubuntu-latest
    needs: [build-images]
    # 15 min — see Tier 1a comment above. `playwright install --with-deps`
    # is the dominant cost and has been observed at 9m+ on slow runners.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Create data directories
        run: |
          mkdir -p data/input data/output data/db
          chmod 777 data/db data/output

      - name: Create CI env file (fixture mode)
        # SF_DESCRIBE_FIXTURES_DIR points at IN-CONTAINER paths — see the
        # docker-compose.e2e-tier-1b.yml overlay below that bind-mounts the
        # host fixture directories to /data/e2e-fixtures/{app,sf}. Without
        # the overlay these paths don't exist in the container and the
        # backend silently falls back to live mode (Codex P1, PR #88).
        # App overlay first, sf baseline as fallback (D5 ordered-lookup).
        run: |
          echo 'APP_DISTRIBUTION=desktop' > .env
          echo 'SF_DESCRIBE_FIXTURES_DIR=/data/e2e-fixtures/app:/data/e2e-fixtures/sf' >> .env

      - name: Download pre-built images
        uses: actions/download-artifact@v8
        with:
          name: e2e-pr-images
          path: /tmp/images

      - name: Load images into local Docker daemon
        run: |
          docker load -i /tmp/images/sfbl-backend.tar
          docker load -i /tmp/images/sfbl-frontend.tar
          docker image ls --filter reference=sfbl-*

      - name: Bring up stack (fixture mode)
        # docker-compose.e2e-tier-1b.yml appends the fixture-dir bind-mounts
        # to the backend service so the SF_DESCRIBE_FIXTURES_DIR paths set
        # in the .env above resolve to real files inside the container.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            -f docker-compose.e2e-tier-1b.yml \
            up -d --wait --timeout 120

      - name: Verify stack is reachable
        run: |
          curl -sf http://localhost/api/health \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Expected status ok, got: {d}'
          print('Health check passed:', d)
          "

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Tier 1b
        working-directory: tests/e2e
        env:
          CI: 'true'
          E2E_BASE_URL: 'http://localhost'
        run: npm run e2e:1b

      # SFBL-334 / SFBL-345: same allure-results upload pattern as Tier 1a.
      - name: Upload Tier 1b allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-tier-1b
          path: tests/e2e/allure-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-tier-1b
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            -f docker-compose.e2e-tier-1b.yml \
            logs

      - name: Bring down stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            -f docker-compose.e2e-tier-1b.yml \
            down -v

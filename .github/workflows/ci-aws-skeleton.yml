name: AWS Skeleton Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase changed so CDK synth can skip
  # itself when infrastructure is untouched.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: true
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - '.github/workflows/ci-aws-skeleton.yml'

  cdk-synth:
    name: CDK Synth
    needs: changes
    # Always run on push to main; on PRs only when infrastructure files changed.
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infrastructure

      - name: TypeScript compile check
        # Validates that all stack definitions compile cleanly before synthesis.
        run: npm run build
        working-directory: infrastructure

      - name: CDK unit tests
        # aws-cdk-lib/assertions checks over the synthesised templates
        # (removal policies, teardown properties, stack membership, tier fan-out).
        run: npm test
        working-directory: infrastructure

      - name: Synthesise CloudFormation templates
        # Validates that all four stacks (Network, Data, Backend, Frontend) are
        # structurally sound. Uses the `ci` env in cdk.json which carries safe
        # non-routable placeholders for vpcCidr / cert ARNs / domain names —
        # staging and production deliberately have no placeholders in cdk.json
        # so operators must populate cdk.context.json (gitignored) before deploy.
        run: npx cdk synth -c env=ci
        working-directory: infrastructure

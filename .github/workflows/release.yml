name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Tier 2 E2E gate (D8) — must pass before any artifacts are published.
  #
  # SECURITY POLICY (D8):
  # - Uses `pull_request`, NOT `pull_request_target` — secrets are never available to fork PR code.
  # - Same-repo PRs only (head.repo.fork == false guard on the job).
  # - See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  #
  # This job runs the full Tier 2 scratch-org suite against the tagged commit
  # before any Docker images or Electron installers are pushed/attached.
  # docker-merge and electron-release both declare `needs: [tier-2-e2e]` so
  # a Tier 2 failure prevents artifact publication entirely.
  # ---------------------------------------------------------------------------
  tier-2-e2e:
    name: E2E Tier 2 — release gate
    runs-on: ubuntu-latest
    # Wall-clock target: under 15 min including scratch-org spin-up (D8).
    timeout-minutes: 30

    env:
      E2E_SCRATCH_ORG: ${{ format('e2e-tier2-release-{0}', github.run_id) }}
      E2E_ORG_SHAPE: ${{ vars.E2E_ORG_SHAPE || 'default' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Authenticate to Dev Hub via JWT
        env:
          SFDX_DEVHUB_JWT_KEY: ${{ secrets.SFDX_DEVHUB_JWT_KEY }}
          SFDX_DEVHUB_CONSUMER_KEY: ${{ secrets.SFDX_DEVHUB_CONSUMER_KEY }}
          SFDX_DEVHUB_USERNAME: ${{ secrets.SFDX_DEVHUB_USERNAME }}
        run: |
          printf '%s' "${SFDX_DEVHUB_JWT_KEY}" > /tmp/key.pem
          chmod 600 /tmp/key.pem
          sf org login jwt \
            -i "${SFDX_DEVHUB_CONSUMER_KEY}" \
            --jwt-key-file /tmp/key.pem \
            --username "${SFDX_DEVHUB_USERNAME}" \
            --set-default-dev-hub
          rm -f /tmp/key.pem
          echo "INFO: Dev Hub authentication complete (username: ${SFDX_DEVHUB_USERNAME})"

      - name: Create scratch org
        run: bash tests/e2e/sf/scripts/scratch_create.sh

      - name: Deploy SFDX project to scratch org
        run: |
          cd tests/e2e/sf/sfdx
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10
          cd "$GITHUB_WORKSPACE/tests/e2e/app/sfdx"
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10

      - name: Assign permission set and create SetupEntityAccess link
        run: bash tests/e2e/sf/scripts/setup_permset_and_access.sh

      - name: Discover ECA consumer key
        run: |
          CONSUMER_KEY="$(bash tests/e2e/sf/scripts/discover_eca_consumer_key.sh)"
          echo "E2E_BULK_LOADER_CONSUMER_KEY=${CONSUMER_KEY}" >> "$GITHUB_ENV"

      - name: JWT smoke test — bulk-loader auth path
        env:
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
        run: |
          bash tests/e2e/sf/scripts/jwt_smoke_test.sh
          ORG_JSON="$(sf org display --target-org "${E2E_SCRATCH_ORG}" --json)"
          INSTANCE_URL="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['instanceUrl'].rstrip('/'))
          ")"
          ADMIN_USERNAME="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['username'])
          ")"
          {
            echo "E2E_SCRATCH_ORG_INSTANCE_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_LOGIN_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_USERNAME=${ADMIN_USERNAME}"
          } >> "$GITHUB_ENV"

      - name: Run Tier 2 Playwright specs
        env:
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
          E2E_RUN_ID: ${{ github.run_id }}
        run: |
          echo "PLACEHOLDER: Playwright Tier 2 run — to be implemented by SFBL-328."
          echo "  Will run: npm run e2e:2 (working-directory: tests/e2e)"
          echo "  Env vars available for setup_connection.ts:"
          echo "    E2E_SCRATCH_ORG_INSTANCE_URL=${E2E_SCRATCH_ORG_INSTANCE_URL}"
          echo "    E2E_SCRATCH_ORG_USERNAME=${E2E_SCRATCH_ORG_USERNAME}"
          echo "    E2E_BULK_LOADER_CONSUMER_KEY=<set, redacted>"

      - name: Destroy scratch org
        if: always()
        run: bash tests/e2e/sf/scripts/scratch_destroy.sh

  # Build each image natively on its target architecture, then merge into a
  # multi-platform manifest. This avoids QEMU emulation (10-20x slower) by
  # running arm64 builds on GitHub's native ubuntu-24.04-arm runners.
  docker-build:
    name: Docker — ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: backend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%FT%TZ)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: matrix.image == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ steps.ver.outputs.git_sha }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}

      - name: Build and push frontend image
        if: matrix.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-${{ matrix.arch }}

  docker-merge:
    name: Docker — merge multi-platform manifests
    needs: [docker-build, tier-2-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Compute version
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge backend manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:latest \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-arm64

      - name: Merge frontend manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:latest \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-arm64

  electron-release:
    name: Build Electron — ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    needs: [tier-2-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            artifact_suffix: mac-arm64
            dir_args: --mac dir
            release_args: --mac zip
            release_glob: electron/dist/*.zip
          - os: windows-2025
            platform: win
            artifact_suffix: windows-x64
            dir_args: --win dir
            release_args: --win nsis
            release_glob: electron/dist/*.exe
          - os: ubuntu-24.04
            platform: linux
            artifact_suffix: linux-x64
            dir_args: --linux dir
            release_args: --linux AppImage
            release_glob: electron/dist/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so git describe can walk back to find tags

      - name: Compute version
        id: ver
        shell: bash
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install backend dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
        working-directory: backend

      - name: Build PyInstaller binary
        run: pyinstaller sf_bulk_loader.spec --clean --noconfirm
        working-directory: backend

      - name: Build frontend (desktop mode)
        run: npm ci && npm run build:desktop
        working-directory: frontend

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Set version from computed version
        # Stamps the computed version (e.g. 0.8.312) into package.json so
        # electron-builder uses the correct version in output filenames.
        run: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version --allow-same-version
        working-directory: electron

      - name: Build unpacked desktop app
        run: npm run dist -- ${{ matrix.dir_args }}
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke packaged app (macOS/Windows)
        if: matrix.platform != 'linux'
        run: node scripts/smoke-packaged.js ${{ matrix.platform }}
        working-directory: electron

      - name: Smoke packaged app (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-packaged.js linux
        working-directory: electron

      - name: Build release artifact
        run: npm run dist -- ${{ matrix.release_args }}
        working-directory: electron
        env:
          # macOS: sign with Developer ID Application cert from GitHub secrets.
          # Non-mac legs leave CSC_LINK unset so electron-builder skips signing naturally.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Notarization (mac only — notarize.js is a no-op when APPLE_ID is unset)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_glob }}

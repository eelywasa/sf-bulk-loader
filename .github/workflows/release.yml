name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  # NOTE: id-token: write (OIDC) is NOT granted here. A workflow-level grant
  # would propagate to every job that doesn't declare its own permissions block
  # (docker, electron, tier-2-e2e), handing them token-minting capability they
  # don't need. It is scoped to the publish-pypi job instead (least privilege).

jobs:
  # ---------------------------------------------------------------------------
  # Tier 2 E2E gate (D8) — must pass before any artifacts are published.
  #
  # SECURITY POLICY (D8):
  # - Uses `pull_request`, NOT `pull_request_target` — secrets are never available to fork PR code.
  # - Same-repo PRs only (head.repo.fork == false guard on the job).
  # - See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  #
  # This job runs the full Tier 2 scratch-org suite against the tagged commit
  # before any Docker images or Electron installers are pushed/attached.
  # docker-merge and electron-release both declare `needs: [tier-2-e2e]` so
  # a Tier 2 failure prevents artifact publication entirely.
  # ---------------------------------------------------------------------------
  tier-2-e2e:
    name: E2E Tier 2 — release gate
    runs-on: ubuntu-latest
    # Wall-clock target: under 15 min including scratch-org spin-up (D8).
    timeout-minutes: 30

    env:
      E2E_SCRATCH_ORG: ${{ format('e2e-tier2-release-{0}', github.run_id) }}
      E2E_ORG_SHAPE: ${{ vars.E2E_ORG_SHAPE || 'default' }}
      NO_COLOR: '1'
      FORCE_COLOR: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Preflight — fail fast with a clear pointer if Tier 2 secrets are absent.
      # Without this, a missing secret produces an opaque CLI auth failure
      # several steps in, which would block release artifact publication
      # in a confusing way.
      - name: Preflight — verify Tier 2 secrets are configured
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
        run: |
          MISSING=()
          [ -z "${SFDX_AUTH_URL}" ]                && MISSING+=("SFDX_AUTH_URL")
          [ -z "${SFBL_E2E_BULK_LOADER_JWT_KEY}" ] && MISSING+=("SFBL_E2E_BULK_LOADER_JWT_KEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Release Tier 2 gate cannot run — missing GitHub secret(s): ${MISSING[*]}"
            echo "::error::See docs/deployment/salesforce-jwt-setup.md § Step 4 for setup."
            exit 1
          fi
          if ! [[ "${SFDX_AUTH_URL}" =~ ^force://.+ ]]; then
            echo "::error::SFDX_AUTH_URL doesn't start with 'force://' — does not look like a valid sfdxAuthUrl."
            exit 1
          fi
          echo "All required Tier 2 secrets are present."

      # Codex P2 on PR #89: jwt_smoke_test.sh's Python helper prefers
      # `cryptography` (falls back to PyJWT); neither is on the GHA
      # ubuntu-latest base image.  Install explicitly to avoid an
      # ImportError before the smoke test validates the scratch org.
      - name: Install JWT signing dependency (cryptography)
        run: pip install --no-input cryptography

      - name: Install CSV factory dependencies (Faker)
        run: pip install --no-input -r tests/e2e/sf/fixtures/csv/requirements.txt

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      # Dev Hub auth via sfdx-url — see e2e-tier-2.yml block for the rationale.
      - name: Authenticate to Dev Hub via sfdx-url
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias devhub \
            --set-default-dev-hub
          USERNAME="$(sf org display --target-org devhub --json | jq -r '.result.username')"
          INSTANCE="$(sf org display --target-org devhub --json | jq -r '.result.instanceUrl')"
          echo "INFO: Dev Hub authentication via sfdx-url complete (username: ${USERNAME}, instance: ${INSTANCE})"

      - name: Create scratch org
        run: bash tests/e2e/sf/scripts/scratch_create.sh

      - name: Deploy SFDX project to scratch org
        run: |
          cd tests/e2e/sf/sfdx
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10
          cd "$GITHUB_WORKSPACE/tests/e2e/app/sfdx"
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10

      - name: Assign permission set and create SetupEntityAccess link
        run: bash tests/e2e/sf/scripts/setup_permset_and_access.sh

      # Disable scratch-org standard duplicate rules so Bulk API inserts
      # aren't blanket-rejected with DUPLICATES_DETECTED:Duplicate Alert.
      # Bulk API 2.0 has no bypass header; the script flips IsActive=false
      # via the Metadata API (idempotent). SFBL-328 / Codex review P1.
      - name: Deactivate Salesforce standard duplicate rules
        run: bash tests/e2e/sf/scripts/disable_duplicate_rules.sh

      - name: Discover ECA consumer key
        run: |
          CONSUMER_KEY="$(bash tests/e2e/sf/scripts/discover_eca_consumer_key.sh)"
          echo "E2E_BULK_LOADER_CONSUMER_KEY=${CONSUMER_KEY}" >> "$GITHUB_ENV"

      - name: JWT smoke test — bulk-loader auth path
        env:
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
        run: |
          bash tests/e2e/sf/scripts/jwt_smoke_test.sh
          ORG_JSON="$(sf org display --target-org "${E2E_SCRATCH_ORG}" --json)"
          INSTANCE_URL="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['instanceUrl'].rstrip('/'))
          ")"
          ADMIN_USERNAME="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['username'])
          ")"
          {
            echo "E2E_SCRATCH_ORG_INSTANCE_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_LOGIN_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_USERNAME=${ADMIN_USERNAME}"
          } >> "$GITHUB_ENV"

      # Codex P1 on PR #89: this previously echoed a placeholder, which
      # meant `docker-merge` and `electron-release` could publish artifacts
      # after scratch setup + JWT smoke succeeded even when the Tier 2
      # specs would have failed.  Real Playwright run now — release artifacts
      # are gated on actual spec pass.
      - name: Create data directories
        run: |
          mkdir -p data/input data/output data/db
          chmod 777 data/db data/output

      - name: Create stack env file (no fixture mode — Tier 2 hits real SF)
        run: |
          echo 'APP_DISTRIBUTION=desktop' > .env

      - name: Bring up app stack
        run: docker compose -f docker-compose.yml up -d --build --wait --timeout 600

      - name: Verify stack is reachable
        run: |
          curl -sf http://localhost/api/health \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Expected status ok, got: {d}'
          print('Health check passed:', d)
          "

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Tier 2 Playwright specs
        working-directory: tests/e2e
        env:
          CI: 'true'
          E2E_BASE_URL: 'http://localhost'
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
          E2E_RUN_ID: ${{ github.run_id }}
        run: npm run e2e:2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier-2-release-${{ github.run_id }}
          path: tests/e2e/playwright-report/
          retention-days: 14

      # SFBL-334 / SFBL-348: always upload Tier 2 allure-results so the
      # test-evidence publish workflow can fetch them via `workflow_run`.
      - name: Upload Tier 2 allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-tier-2
          path: tests/e2e/allure-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Bring down app stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

      - name: Destroy scratch org
        if: always()
        run: bash tests/e2e/sf/scripts/scratch_destroy.sh

  # Build each image natively on its target architecture, then merge into a
  # multi-platform manifest. This avoids QEMU emulation (10-20x slower) by
  # running arm64 builds on GitHub's native ubuntu-24.04-arm runners.
  docker-build:
    name: Docker — ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: backend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%FT%TZ)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: matrix.image == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ steps.ver.outputs.git_sha }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}

      - name: Build and push frontend image
        if: matrix.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-${{ matrix.arch }}

  docker-merge:
    name: Docker — merge multi-platform manifests
    needs: [docker-build, tier-2-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Compute version
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge backend manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:latest \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-backend:${{ steps.ver.outputs.version }}-arm64

      - name: Merge frontend manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:latest \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/sf-bulk-loader-frontend:${{ steps.ver.outputs.version }}-arm64

  electron-release:
    name: Build Electron — ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    needs: [tier-2-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            artifact_suffix: mac-arm64
            dir_args: --mac dir
            release_args: --mac dmg
            release_glob: electron/dist/*.dmg
          - os: windows-2025
            platform: win
            artifact_suffix: windows-x64
            dir_args: --win dir
            release_args: --win nsis
            release_glob: electron/dist/*.exe
          - os: ubuntu-24.04
            platform: linux
            artifact_suffix: linux-x64
            dir_args: --linux dir
            release_args: --linux AppImage
            release_glob: electron/dist/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so git describe can walk back to find tags

      - name: Compute version
        id: ver
        shell: bash
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install backend dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
          # SFBL-364: the desktop binary serves the MCP server via the `mcp`
          # subcommand (single-binary design), so PyInstaller must be able to
          # bundle sf_bulk_loader_mcp + the mcp SDK. Install the mcp-server
          # package (pulls in `mcp`) into the build venv before freezing.
          pip install ../mcp-server
        working-directory: backend

      - name: Build PyInstaller binary
        run: pyinstaller sf_bulk_loader.spec --clean --noconfirm
        working-directory: backend

      - name: Build frontend (desktop mode)
        run: npm ci && npm run build:desktop
        working-directory: frontend

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Set version from computed version
        # Stamps the computed version (e.g. 0.8.312) into package.json so
        # electron-builder uses the correct version in output filenames.
        run: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version --allow-same-version
        working-directory: electron

      - name: Build unpacked desktop app
        run: npm run dist -- ${{ matrix.dir_args }}
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke packaged app (macOS/Windows)
        if: matrix.platform != 'linux'
        run: node scripts/smoke-packaged.js ${{ matrix.platform }}
        working-directory: electron

      - name: Smoke packaged app (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-packaged.js linux
        working-directory: electron

      - name: Build release artifact
        run: npm run dist -- ${{ matrix.release_args }}
        working-directory: electron
        env:
          # macOS: sign with Developer ID Application cert from GitHub secrets.
          # Non-mac legs leave CSC_LINK unset so electron-builder skips signing naturally.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Notarization (mac only) — electron-builder's built-in notarize step runs
          # when these vars are set; gated in electron-builder.config.js on APPLE_TEAM_ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_glob }}

      # SFBL-333: bump the Homebrew cask in the eelywasa/homebrew-sf-bulk-loader
      # tap on each macOS release. Cross-repo push needs HOMEBREW_TAP_TOKEN
      # (fine-grained PAT, Contents: read & write on the tap repo). The step is
      # a no-op until that secret is set, so it never breaks a release.
      - name: Bump Homebrew cask
        if: matrix.platform == 'mac'
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew cask bump."
            exit 0
          fi
          set -euo pipefail
          DMG="$(ls electron/dist/*.dmg | head -1)"
          SHA="$(shasum -a 256 "${DMG}" | awk '{print $1}')"
          ASSET="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets -q '.assets[] | select(.name | endswith(".dmg")) | .name' | head -1)"
          if [ -z "${ASSET}" ]; then
            echo "::error::No .dmg asset found on release ${TAG}"; exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "Bumping cask -> version=${VERSION} sha256=${SHA} url=${URL}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/eelywasa/homebrew-sf-bulk-loader.git" tap
          cd tap
          VERSION="${VERSION}" SHA="${SHA}" URL="${URL}" perl -pi -e '
            s{^(\s*)version .*}{$1 . "version \"$ENV{VERSION}\""}e;
            s{^(\s*)sha256 .*}{$1 . "sha256 \"$ENV{SHA}\""}e;
            s{^(\s*)url .*}{$1 . "url \"$ENV{URL}\""}e;
          ' Casks/sf-bulk-loader.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sf-bulk-loader.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date for ${VERSION}."; exit 0
          fi
          git commit -m "sf-bulk-loader ${VERSION}"
          git push

  # ---------------------------------------------------------------------------
  # SFBL-372 — Publish MCP server to PyPI via OIDC Trusted Publisher.
  #
  # Prerequisites (owner one-time setup, already done):
  #   1. PyPI Trusted Publisher configured at pypi.org/manage/account/publishing/
  #      pointing at this workflow (release.yml) + the `pypi` GitHub Environment.
  #   2. A `pypi` GitHub Environment created in repo Settings → Environments
  #      (optionally with a required-reviewer protection rule).
  #
  # Version: strip the `v` prefix from the tag (e.g. v0.11 → 0.11) and inject
  # into pyproject.toml before building, consistent with how Docker/Electron
  # derive their versions from GITHUB_REF_NAME. PEP 440 accepts a 2-part version.
  #
  # Gating: `needs: [tier-2-e2e]` chains this after the release E2E gate, BUT
  # tier-2-e2e is a Salesforce scratch-org suite that does NOT exercise the
  # Python package. So this job ALSO runs the mcp-server unit tests and a built-
  # artifact smoke test as in-job steps before the publish step — a broken
  # package therefore cannot reach PyPI (publish is the last step and only runs
  # if every prior step passed).
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish MCP server to PyPI
    needs: [tier-2-e2e]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level permissions block resets every unspecified scope to `none`,
      # so contents: read must be restated here for actions/checkout to fetch
      # the repo (it has no other token/SSH auth).
      contents: read
      id-token: write   # OIDC Trusted Publisher token exchange

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mcp-server tests (publish gate)
        # tier-2-e2e does not cover the Python package; gate the publish on the
        # package's own suite so a regression cannot ship to PyPI.
        run: |
          pip install ./mcp-server pytest pytest-asyncio
          pytest mcp-server/tests -q

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing sf-bulk-loader-mcp==${VERSION} to PyPI"

      - name: Inject version into pyproject.toml
        # Replaces the pinned `version = "x.y.z"` line with the tag-derived
        # version so the published package matches the release tag. The src layout
        # has exactly one top-level `version = ` line (the [project] one);
        # [build-system] uses `requires` and dep pins use `>=`, so this is safe.
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.ver.outputs.version }}\"/" mcp-server/pyproject.toml

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build distribution
        run: python -m build mcp-server/
        # Produces mcp-server/dist/sf_bulk_loader_mcp-<version>.tar.gz
        # and mcp-server/dist/sf_bulk_loader_mcp-<version>-py3-none-any.whl

      - name: Smoke-test the built wheel
        # Install the freshly-built wheel into a clean venv and confirm the
        # console entrypoint resolves — catches packaging regressions (missing
        # module, broken console_scripts) that editable installs would mask.
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install mcp-server/dist/*.whl
          /tmp/wheel-smoke/bin/sf-bulk-loader-mcp --version
          /tmp/wheel-smoke/bin/python -c "import sf_bulk_loader_mcp; print('import OK', sf_bulk_loader_mcp.__version__)"

      - name: Publish to PyPI
        # NOTE: @release/v1 is PyPA's maintained major-version ref. Pinning to a
        # full commit SHA would be stricter supply-chain hygiene; deferred to
        # avoid an unverified pin (tracked as a follow-up).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist/

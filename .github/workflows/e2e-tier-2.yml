name: E2E Tier 2 — PR label opt-in

# SECURITY POLICY (D8):
# - Uses `pull_request`, NOT `pull_request_target` — secrets are never available to fork PR code.
# - Same-repo PRs only (head.repo.fork == false guard on the job).
# - See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
#
# This workflow fires when a maintainer adds the `tier-2` label to a same-repo PR,
# or when a same-repo PR with that label is synchronised or reopened.
#
# Nightly cron → .github/workflows/e2e-tier-2-nightly.yml
# Release-tag gate → .github/workflows/release.yml (tier-2-e2e job)
#
# Fork PRs: skipped entirely (would not receive secrets even if they ran).
# Maintainer-curated manual runs via workflow_dispatch are the path for fork
# PRs needing Tier 2 verification after a diff review.

on:
  pull_request:
    # `labeled` MUST be listed explicitly — the default set
    # [opened, synchronize, reopened] does NOT include it, so the workflow
    # would never fire when the label is first added (review-pass finding M2).
    types: [labeled, synchronize, reopened]

  # Ad-hoc manual firing from the Actions UI.  Inputs let the operator override
  # the scratch-org alias (handy when validating against a long-lived shape) and
  # skip the destroy step for post-mortem inspection on a failed run.
  workflow_dispatch:
    inputs:
      scratch_org_alias:
        description: 'Override E2E_SCRATCH_ORG (default: workflow-generated unique alias)'
        type: string
        required: false
        default: ''
      skip_destroy:
        description: 'Skip scratch-org destroy at the end (for post-mortem inspection — REMEMBER TO DELETE MANUALLY)'
        type: boolean
        required: false
        default: false

# Minimum permissions — contents: read for checkout, pull-requests: read
# to check labels on pull_request events.
permissions:
  contents: read
  pull-requests: read

# Only one Tier 2 run at a time per ref to avoid scratch-org quota exhaustion.
concurrency:
  group: e2e-tier-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-2-e2e:
    name: E2E Tier 2 — scratch org
    runs-on: ubuntu-latest
    # Wall-clock target: under 15 min including scratch-org spin-up (D8).
    timeout-minutes: 30

    # Gate: only run when:
    #   (a) the `tier-2` label is present, AND
    #   (b) the PR is from the same repo (not a fork) — secrets policy (D8).
    # workflow_dispatch bypasses the PR check entirely (no PR context exists).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        contains(github.event.pull_request.labels.*.name, 'tier-2')
      )

    env:
      # Scratch org alias scoped to this workflow run to avoid clashes.
      # workflow_dispatch can override this via the scratch_org_alias input.
      E2E_SCRATCH_ORG: ${{ inputs.scratch_org_alias != '' && inputs.scratch_org_alias || format('e2e-tier2-{0}', github.run_id) }}
      # E2E_ORG_SHAPE defaults to "default" (no org shape) unless overridden
      # in the repo's Actions variables. Set to a 15- or 18-char org ID to
      # enable org-shape mode (see scratch_create.sh for full details).
      E2E_ORG_SHAPE: ${{ vars.E2E_ORG_SHAPE || 'default' }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up runtimes
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # 3. Install Salesforce CLI
      # -----------------------------------------------------------------------
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      # -----------------------------------------------------------------------
      # 4. JWT login to Dev Hub (D6)
      #
      # Secrets required (never exposed on fork PRs — see security note above):
      #   SFDX_DEVHUB_JWT_KEY      — PEM private key contents
      #   SFDX_DEVHUB_CONSUMER_KEY — OAuth consumer key (client ID)
      #   SFDX_DEVHUB_USERNAME     — Dev Hub org username
      # -----------------------------------------------------------------------
      - name: Authenticate to Dev Hub via JWT
        env:
          SFDX_DEVHUB_JWT_KEY: ${{ secrets.SFDX_DEVHUB_JWT_KEY }}
          SFDX_DEVHUB_CONSUMER_KEY: ${{ secrets.SFDX_DEVHUB_CONSUMER_KEY }}
          SFDX_DEVHUB_USERNAME: ${{ secrets.SFDX_DEVHUB_USERNAME }}
        run: |
          # Write the private key PEM to a temp file so the CLI can read it.
          printf '%s' "${SFDX_DEVHUB_JWT_KEY}" > /tmp/key.pem
          chmod 600 /tmp/key.pem

          sf org login jwt \
            -i "${SFDX_DEVHUB_CONSUMER_KEY}" \
            --jwt-key-file /tmp/key.pem \
            --username "${SFDX_DEVHUB_USERNAME}" \
            --set-default-dev-hub

          # Remove the key from disk immediately after auth.
          rm -f /tmp/key.pem

          echo "INFO: Dev Hub authentication complete (username: ${SFDX_DEVHUB_USERNAME})"

      # -----------------------------------------------------------------------
      # 5. Create scratch org (D3)
      #
      # scratch_create.sh handles:
      #   - Default vs. org-shape scratch-def selection (E2E_ORG_SHAPE).
      #   - 15/18-char org ID normalisation (L2 third-pass).
      #   - Active-shape prerequisite check (L1 + M1 fourth-pass).
      # -----------------------------------------------------------------------
      - name: Create scratch org
        run: bash tests/e2e/sf/scripts/scratch_create.sh

      # -----------------------------------------------------------------------
      # 6. Deploy SFDX project to scratch org
      #
      # Deploys both SFDX projects:
      #   - tests/e2e/sf/sfdx       — Salesforce ECA + certificate + permission set
      #   - tests/e2e/app/sfdx      — App-specific SfblE2ETest__c custom object
      # -----------------------------------------------------------------------
      - name: Deploy SFDX project to scratch org
        run: |
          cd tests/e2e/sf/sfdx
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10
          cd "$GITHUB_WORKSPACE/tests/e2e/app/sfdx"
          sf project deploy start --target-org "${E2E_SCRATCH_ORG}" --wait 10

      # -----------------------------------------------------------------------
      # 7a. Assign permission set + create SetupEntityAccess link (SFBL-327)
      #
      # Assigns SfblE2EPermSet to the scratch admin user and creates the
      # SetupEntityAccess record linking the permission set to the ECA.
      # WITHOUT this step AdminApprovedPreAuthorized is not activated and
      # the JWT bearer grant fails with a 400 auth error.
      # -----------------------------------------------------------------------
      - name: Assign permission set and create SetupEntityAccess link
        run: bash tests/e2e/sf/scripts/setup_permset_and_access.sh

      # -----------------------------------------------------------------------
      # 7b. Discover ECA consumer key (SFBL-327)
      #
      # Retrieves ExtlClntAppGlobalOauthSettings:SfblE2E from the scratch org
      # and parses the <consumerKey> element from the XML.  Exports the key
      # to GITHUB_ENV so downstream steps can reference it as
      # $E2E_BULK_LOADER_CONSUMER_KEY.
      # -----------------------------------------------------------------------
      - name: Discover ECA consumer key
        run: |
          CONSUMER_KEY="$(bash tests/e2e/sf/scripts/discover_eca_consumer_key.sh)"
          echo "E2E_BULK_LOADER_CONSUMER_KEY=${CONSUMER_KEY}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 7c. JWT smoke test — bulk-loader auth path (SFBL-327)
      #
      # Performs a direct JWT bearer grant against
      # <instance_url>/services/oauth2/token using the private key PEM from
      # the SFBL_E2E_BULK_LOADER_JWT_KEY secret.  This mirrors EXACTLY the
      # auth path used by backend/app/services/salesforce_auth.py.
      #
      # A failure here exits the workflow before any Playwright spec runs,
      # with a clear ECA-setup error message instead of confusing downstream
      # spec failures.
      # -----------------------------------------------------------------------
      - name: JWT smoke test — bulk-loader auth path
        env:
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
        run: |
          bash tests/e2e/sf/scripts/jwt_smoke_test.sh

          # Export org details for setup_connection.ts (used by Playwright specs).
          ORG_JSON="$(sf org display --target-org "${E2E_SCRATCH_ORG}" --json)"
          INSTANCE_URL="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['instanceUrl'].rstrip('/'))
          ")"
          ADMIN_USERNAME="$(printf '%s' "${ORG_JSON}" | python3 -c "
          import sys, json
          print(json.load(sys.stdin)['result']['username'])
          ")"
          {
            echo "E2E_SCRATCH_ORG_INSTANCE_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_LOGIN_URL=${INSTANCE_URL}"
            echo "E2E_SCRATCH_ORG_USERNAME=${ADMIN_USERNAME}"
          } >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 8. Run Tier 2 Playwright specs
      #
      # SFBL_E2E_BULK_LOADER_JWT_KEY and the org-detail env vars
      # (E2E_SCRATCH_ORG_INSTANCE_URL, E2E_SCRATCH_ORG_LOGIN_URL,
      # E2E_SCRATCH_ORG_USERNAME, E2E_BULK_LOADER_CONSUMER_KEY) are wired
      # here for setup_connection.ts.
      # -----------------------------------------------------------------------
      - name: Run Tier 2 Playwright specs
        env:
          SFBL_E2E_BULK_LOADER_JWT_KEY: ${{ secrets.SFBL_E2E_BULK_LOADER_JWT_KEY }}
          E2E_RUN_ID: ${{ github.run_id }}
        run: |
          echo "PLACEHOLDER: Playwright Tier 2 run — to be implemented by SFBL-328."
          echo "  Will run: npm run e2e:2 (working-directory: tests/e2e)"
          echo "  Env vars available for setup_connection.ts:"
          echo "    E2E_SCRATCH_ORG_INSTANCE_URL=${E2E_SCRATCH_ORG_INSTANCE_URL}"
          echo "    E2E_SCRATCH_ORG_USERNAME=${E2E_SCRATCH_ORG_USERNAME}"
          echo "    E2E_BULK_LOADER_CONSUMER_KEY=<set, redacted>"

      # -----------------------------------------------------------------------
      # 9. Destroy scratch org — ALWAYS runs to prevent org leaks (D3)
      #
      # Exception: when invoked via workflow_dispatch with skip_destroy=true,
      # leave the org up for post-mortem inspection.  The dispatch input
      # description warns the operator that they must delete it manually.
      # -----------------------------------------------------------------------
      - name: Destroy scratch org
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.skip_destroy)
        run: bash tests/e2e/sf/scripts/scratch_destroy.sh

      - name: Skip scratch-org destroy (workflow_dispatch with skip_destroy=true)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_destroy
        run: |
          echo "::warning::Scratch org '${E2E_SCRATCH_ORG}' was NOT destroyed (skip_destroy=true)."
          echo "::warning::Run 'sf org delete scratch --target-org ${E2E_SCRATCH_ORG} --no-prompt' to clean it up."

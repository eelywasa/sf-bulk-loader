[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# TODO (SFBL-372): version is pinned here manually; the release workflow will
# need to update this field (or inject it via env/tag) when cutting releases.
name = "sf-bulk-loader-mcp"
version = "0.11.0"
description = "MCP server for Salesforce Bulk Loader — exposes lifecycle tools to Claude and other MCP clients"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.scripts]
sf-bulk-loader-mcp = "sf_bulk_loader_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
